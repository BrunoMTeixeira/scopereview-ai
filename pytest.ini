[pytest]
pythonpath = .
testpaths = tests
addopts = --cov=src --cov-fail-under=90 --cov-report=term:skip-covered --disable-warnings
asyncio_mode = auto
markers =
    unit: Unit tests (fast, no I/O)
    integration: Integration tests (mock adapters, real services)
    e2e: End-to-end tests (TestClient + full app)
    system: System/blackbox tests
